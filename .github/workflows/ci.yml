name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Instalar as dependências de teste
        run: python -m pip install -r requirements-test.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      # Sem PyTorch e sem os codecs: os testes da rede rodam no job abaixo e os
      # de integração com FFmpeg e EVS rodam na imagem Docker (docker.yml).
      - name: Testes
        run: python -m pytest -m "not torch and not codecs"

  torch:
    name: Testes da rede (PyTorch, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Instalar as dependências de teste e o PyTorch (CPU)
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      # test_hygiene.py também importa os módulos que dependem do PyTorch
      # (latency_bench e build_dataset_asvspoof2021).
      - name: Testes da rede e importação de todos os módulos
        run: python -m pytest tests/test_torch_models.py tests/test_hygiene.py
